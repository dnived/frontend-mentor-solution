<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Contact form</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="form-container">
      <p>Contact Form</p>
      <form>
        <div class="name-input-field-container">
          <div class="input-and-label-container">
            <label for="firstname"> First Name </label>
            <input type="text" name="firstname" />
            <p class="error-message">Error</p>
          </div>
          <div class="input-and-label-container">
            <label for="lastname"> Last Name </label>
            <input type="text" name="lastname" />
            <p class="error-message">Error</p>
          </div>
        </div>

        <!-- email -->
        <div class="email-input-field">
          <div class="input-and-label-container">
            <label for="email"> Email Address </label>
            <input type="text" name="email" />
            <p class="error-message">Error</p>
          </div>
        </div>

        <!-- QueryType -->
        <div class="radio-option-container">
          <label> Query Type</label>
          <div class="query-options">
            <div class="query-option-container">
              <input type="radio" name="QueryType" />
              <label for="QueryType"> General Query </label>
              <p class="error-message">Error</p>
            </div>

            <div class="query-option-container">
              <input type="radio" name="QueryType" />
              <label for="QueryType"> Support Request </label>
              <p class="error-message">Error</p>
            </div>
          </div>
        </div>

        <!-- Message Box -->
        <div class="message-input-field-container">
          <label> Message </label>
          <textarea rows="6"></textarea>
          <p class="error-message">Error</p>
        </div>

        <!-- checkbox -->
        <div class="checkbox-container">
          <input type="checkbox" />
          <label> I consent to being contacted by the team. </label>
          <p class="error-message">Error</p>
        </div>

        <!-- button -->
        <div class="submit-button-container">
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>
    <!-- <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </div> -->
  </body>
</html>
